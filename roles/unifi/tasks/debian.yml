---

- get_url:
    url: https://dl.ui.com/unifi/unifi-repo.gpg
    dest: /etc/apt/keyrings/unifi-repo.gpg
  become: yes

- apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/unifi-repo.gpg] https://www.ui.com/downloads/unifi/debian stable ubiquiti"
    update_cache: false
    state: present
  become: yes

