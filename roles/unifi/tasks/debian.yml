- get_url:
    url: https://www.mongodb.org/static/pgp/server-3.4.asc
    dest: /etc/apt/keyrings/mongodb-server-3.4.asc
  become: yes

- apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/mongodb-server-3.4.asc] http://repo.mongodb.org/apt/ubuntu xenial/mongodb-org/3.4 multiverse"
    update_cache: false
    state: present
  become: yes

- apt:
    name: unifi
    update_cache: yes
  become: yes
